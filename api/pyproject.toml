[project]
name = "petposter-api"
version = "0.1.0"
description = "PetPoster AI 后端 API 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0",
  "bcrypt>=4.0.0",
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "pillow>=11.0.0",
  "psycopg[binary]>=3.3.0",
  "pydantic-settings>=2.12.0",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.45",
  "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
]
